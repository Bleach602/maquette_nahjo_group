<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Connexion · NutriTrack</title>
  <meta name="description" content="Accès sécurisé à la plateforme NutriTrack — Nahjo Group." />

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5d52'/%3E%3Ctext x='16' y='21' font-family='Inter,system-ui,sans-serif' font-size='12' font-weight='800' fill='%23ffffff' text-anchor='middle' letter-spacing='0.5'%3ENG%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --brand:#1f5d52;
      --brand-2:#2a7669;
      --brand-hover:#184a41;
      --brand-soft:rgba(31,93,82,.10);

      --ink:#13211d;
      --soft:#586763;
      --muted:#8a9692;
      --line:#dfe7e4;

      --bg:#f3f7f5;

      --err:#c0392f;
      --err-bg:#fdf0ee;
      --ok:#1a7a62;
      --ok-bg:#eaf7f2;

      --r:12px;
      --ease:cubic-bezier(.2,.8,.2,1);
      --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

      --fs-xs:clamp(.72rem,.7rem + .12vw,.8rem);
      --fs-sm:clamp(.82rem,.8rem + .12vw,.9rem);
      --fs-md:clamp(.95rem,.9rem + .12vw,1rem);
      --fs-h1:clamp(1.6rem,1.35rem + .8vw,2rem);
      --fs-mark:clamp(1.5rem,1.2rem + 1vw,2.2rem);
      --pad-x:clamp(1.5rem, 3vw, 3rem);
      --pad-y:clamp(1.2rem, 3vh, 2.5rem);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body{
      margin:0;
      font:400 var(--fs-md)/1.5 var(--font);
      color:var(--ink);
      background:#fff;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input,a{ font:inherit; color:inherit; }
    button{ background:none; border:0; cursor:pointer; }
    a{ text-decoration:none; }
    [hidden]{ display:none!important; }

    .login{
      display:grid;
      grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
      min-height:100vh;
      overflow:hidden;
    }

    /* ===== GAUCHE ===== */
    .visual{
      position:relative;
      isolation:isolate;
      color:#fff;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding: var(--pad-y) var(--pad-x);
      background:
        linear-gradient(180deg, rgba(9,25,22,.58) 0%, rgba(9,25,22,.38) 42%, rgba(9,25,22,.72) 100%),
        url("https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=1400&q=80") center/cover no-repeat,
        var(--brand);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:.8rem;
      font-weight:600;
      font-size:var(--fs-sm);
      letter-spacing:.01em;
    }

    .brand .mark{
      width:2.45rem;
      height:2.45rem;
      display:grid;
      place-items:center;
      border-radius:11px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.22);
      font-weight:800;
      font-size:.7rem;
      letter-spacing:.06em;
      color:#fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.24);
    }

    .claim{
      font-size:var(--fs-mark);
      font-weight:700;
      line-height:1.14;
      letter-spacing:-.05em;
      max-width:16ch;
    }

    /* ===== DROITE — Option 1 "Paper soft" ===== */
    .panel{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: var(--pad-y) var(--pad-x);
      overflow:hidden;
      background:
        radial-gradient(ellipse 50% 40% at 90% 8%, rgba(42,118,105,.09), transparent 70%),
        linear-gradient(180deg, #fafcfb 0%, #f2f7f4 100%);
    }

    .auth{
      position:relative;
      z-index:1;
      width:100%;
      max-width:400px;
      display:flex;
      flex-direction:column;
      gap:1.5rem;
    }

    .auth__header{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap: 1rem;
    }

    .auth__avatar{
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display:grid;
      place-items:center;
      background:#fff;
      color:var(--brand);
      border:1px solid rgba(31,93,82,.10);
      box-shadow:
        0 16px 36px -12px rgba(31,93,82,.42),
        0 4px 10px -4px rgba(31,93,82,.18),
        inset 0 1px 0 rgba(255,255,255,.65);
      flex-shrink:0;
    }

    .auth__avatar img{
      width:72px;
      height:72px;
      display:block;
      border-radius:50%;
    }

    .auth__avatar svg{
      width:56px;
      height:56px;
      stroke-width:1.5;
    }

    .auth__welcome{
      font-size: var(--fs-h1);
      font-weight: 800;
      line-height:1.1;
      letter-spacing:-.035em;
      color:var(--ink);
    }

    .alert{
      padding:.7rem .85rem;
      border-radius: var(--r);
      font-size: var(--fs-sm);
      font-weight:500;
      line-height:1.45;
      background: var(--err-bg);
      color: var(--err);
      border:1px solid rgba(192,57,47,.12);
    }
    .alert--ok{
      background: var(--ok-bg);
      color: var(--ok);
      border-color: rgba(26,122,98,.12);
    }

    form{
      display:flex;
      flex-direction:column;
      gap:1rem;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:.42rem;
    }

    .field label{
      font-size: var(--fs-sm);
      font-weight:600;
      color:var(--ink);
      letter-spacing:-.005em;
      margin-left:.15rem;
    }

    .control{
      position:relative;
      display:block;
    }

    .control__icon{
      position:absolute;
      left:.95rem;
      top:50%;
      transform:translateY(-50%);
      width:1.05rem;
      height:1.05rem;
      color:var(--muted);
      pointer-events:none;
      transition:color .16s var(--ease);
      z-index:1;
    }
    .control__icon svg{ width:100%; height:100%; stroke-width:1.7; }

    .control__input{
      width:100%;
      height:3rem;
      padding:0 .95rem 0 2.85rem;
      border:1px solid var(--line);
      border-radius: var(--r);
      background:#fff;
      font-size: var(--fs-md);
      color:var(--ink);
      outline:none;
      transition: border-color .16s var(--ease),
                  box-shadow .16s var(--ease),
                  background-color .16s var(--ease);
    }
    .control__input::placeholder{ color:#a6b0ac; }
    .control__input:hover{ border-color:#c4d0cd; }
    .control__input:focus{
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }
    .control:focus-within .control__icon{ color:var(--brand); }

    .control--pw .control__input{ padding-right:2.85rem; }

    .eye{
      position:absolute;
      top:50%;
      right:.4rem;
      transform:translateY(-50%);
      width:2.1rem;
      height:2.1rem;
      display:grid;
      place-items:center;
      border-radius:7px;
      color:var(--muted);
      transition:color .14s var(--ease), background .14s var(--ease);
      z-index:2;
    }
    .eye:hover{ color:var(--ink); background: rgba(16,32,28,.05); }
    .eye svg{ width:1.05rem; height:1.05rem; stroke-width:1.7; }
    .eye .off{ display:none; }
    .eye[aria-pressed="true"] .on{ display:none; }
    .eye[aria-pressed="true"] .off{ display:block; }

    .err{
      display:none;
      min-height:1rem;
      font-size:var(--fs-xs);
      color:var(--err);
      line-height:1.3;
    }

    .field.bad .control__input{
      border-color: rgba(192,57,47,.6);
    }
    .field.bad .control__input:focus{
      box-shadow:0 0 0 3px rgba(192,57,47,.10);
    }
    .field.bad .err{ display:block; }

    .caps{
      font-size: var(--fs-xs);
      color: var(--soft);
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:.75rem;
    }
    .check{
      display:inline-flex;
      align-items:center;
      gap:.55rem;
      color: var(--soft);
      font-size: var(--fs-sm);
      cursor:pointer;
      user-select:none;
    }
    .check input{ width:.95rem; height:.95rem; accent-color: var(--brand); }
    .link{ color: var(--brand); font-size: var(--fs-sm); font-weight:600; }
    .link:hover{ text-decoration:underline; text-underline-offset:3px; }

    .btn{
      width:100%;
      height:3.05rem;
      margin-top:.25rem;
      border-radius: var(--r);
      color:#fff;
      background: var(--brand);
      font-size: var(--fs-md);
      font-weight:600;
      letter-spacing:-.005em;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      transition: background .16s var(--ease), box-shadow .16s var(--ease), opacity .16s var(--ease);
    }
    .btn:hover:not(:disabled){
      background: var(--brand-hover);
      box-shadow: 0 8px 18px -8px rgba(31,93,82,.45);
    }
    .btn:focus-visible{ outline:none; box-shadow: 0 0 0 3px var(--brand-soft); }
    .btn:disabled{
      background:#c3cfca;
      color:#f4f7f6;
      cursor:not-allowed;
      box-shadow:none;
      opacity:1;
    }

    .spin{
      display:none;
      width:.9rem;
      height:.9rem;
      border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin .75s linear infinite;
    }
    .btn.load .spin{ display:block; }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    /* ===== FOOTER SÉCURITÉ — Option A (pastille) ===== */
    .auth__footer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      padding:.7rem .9rem;
      background: rgba(31,93,82,.06);
      border:1px solid rgba(31,93,82,.12);
      border-radius:10px;
      font-size: var(--fs-xs);
      color: var(--brand);
      font-weight:500;
      line-height:1.4;
      text-align:center;
    }
    .auth__footer svg{
      width:.9rem;
      height:.9rem;
      color:var(--brand);
      flex-shrink:0;
    }

    @media (max-width:900px){
      .login{ grid-template-columns:1fr; }
      .visual{ display:none; }
      .panel{ align-items:flex-start; padding-top:3rem; }
      .auth{ margin-inline:auto; }
    }

    @media (max-width:430px){
      .row{ flex-direction:column; align-items:flex-start; gap:.6rem; }
      .auth__avatar{ width:84px; height:84px; }
      .auth__avatar img{ width:60px; height:60px; }
      .auth__avatar svg{ width:46px; height:46px; }
      .auth__footer{ font-size:.68rem; padding:.6rem .75rem; }
    }

    @media (prefers-reduced-motion:reduce){
      *{ animation:none!important; transition:none!important; }
    }
  </style>
</head>
<body>

  <main class="login">

    <aside class="visual" aria-hidden="true">
      <div class="brand">
        <span class="mark">NG</span>
        <span>Nahjo Group</span>
      </div>
      <p class="claim">NutriTrack.<br>Votre activité, sous contrôle.</p>
    </aside>

    <section class="panel">
      <div class="auth">
        <header class="auth__header">
          <div class="auth__avatar" aria-hidden="true">
            <img
              src="https://api.dicebear.com/9.x/notionists/svg?seed=NutriTrack&backgroundColor=e8f2ee&radius=50"
              alt=""
              width="72"
              height="72"
              onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
            />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21c0-3.9 3.6-7 8-7s8 3.1 8 7"/>
            </svg>
          </div>
          <h1 class="auth__welcome">Bienvenue</h1>
        </header>

        <div id="alert" class="alert" role="alert" hidden></div>

        <form id="form" novalidate>
          <div class="field">
            <label for="email">Adresse e-mail</label>
            <div class="control">
              <span class="control__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="14" rx="2.5"/>
                  <path d="m4 7 8 5 8-5"/>
                </svg>
              </span>
              <input
                id="email"
                name="email"
                class="control__input"
                type="email"
                placeholder="vous@nahjo-group.com"
                autocomplete="username"
                inputmode="email"
                autocapitalize="none"
                spellcheck="false"
                aria-describedby="e-err"
              />
            </div>
            <p class="err" id="e-err"></p>
          </div>

          <div class="field">
            <label for="password">Mot de passe</label>
            <div class="control control--pw">
              <span class="control__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="10" width="16" height="10" rx="2.5"/>
                  <path d="M8 10V7a4 4 0 1 1 8 0v3"/>
                </svg>
              </span>
              <input
                id="password"
                name="password"
                class="control__input"
                type="password"
                placeholder="Votre mot de passe"
                autocomplete="current-password"
                aria-describedby="p-err"
              />
              <button
                type="button"
                class="eye"
                id="eye"
                aria-label="Afficher le mot de passe"
                aria-pressed="false"
              >
                <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M3 3l18 18"/>
                </svg>
              </button>
            </div>
            <p class="caps" id="caps" hidden>Verr. Maj activée</p>
            <p class="err" id="p-err"></p>
          </div>

          <div class="row">
            <label class="check">
              <input type="checkbox" name="remember" />
              <span>Se souvenir de moi</span>
            </label>
            <a class="link" href="#">Mot de passe oublié ?</a>
          </div>

          <button class="btn" id="btn" type="submit" disabled>
            <span id="lbl">Se connecter</span>
            <span class="spin" aria-hidden="true"></span>
          </button>
        </form>

        <footer class="auth__footer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <rect x="4" y="10" width="16" height="11" rx="2"/>
            <path d="M8 10V7a4 4 0 1 1 8 0v3"/>
          </svg>
          <span>Vos données sont chiffrées et sécurisées.</span>
        </footer>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const $ = id => document.getElementById(id);
      const form = $('form');
      const email = $('email');
      const password = $('password');
      const btn = $('btn');
      const lbl = $('lbl');
      const eye = $('eye');
      const alertBox = $('alert');
      const caps = $('caps');

      const isValidEmail = value => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());

      function refreshButtonState() {
        const emailOK = isValidEmail(email.value);
        const passOK = password.value.length >= 6;
        btn.disabled = !(emailOK && passOK);
      }

      function checkInput(input) {
        const field = input.closest('.field');
        const value = input.value.trim ? input.value.trim() : input.value;
        let message = '';

        if (input.name === 'email') {
          if (!value) message = 'Veuillez saisir votre e-mail.';
          else if (!isValidEmail(value)) message = 'Adresse e-mail invalide.';
        } else if (input.name === 'password') {
          if (!value) message = 'Veuillez saisir votre mot de passe.';
          else if (value.length < 6) message = 'Minimum 6 caractères.';
        }

        field.classList.toggle('bad', !!message);
        const err = field.querySelector('.err');
        err.textContent = message;

        refreshButtonState();
        return !message;
      }

      [email, password].forEach(input => {
        input.addEventListener('input', () => {
          alertBox.hidden = true;
          if (input.closest('.field').classList.contains('bad')) {
            checkInput(input);
          } else {
            refreshButtonState();
          }
        });

        input.addEventListener('blur', () => {
          if (input.value) checkInput(input);
        });
      });

      eye.addEventListener('click', () => {
        const show = password.type === 'password';
        password.type = show ? 'text' : 'password';
        eye.setAttribute('aria-pressed', String(show));
        eye.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
        password.focus();
      });

      password.addEventListener('keydown', e => {
        caps.hidden = !(e.getModifierState && e.getModifierState('CapsLock'));
      });
      password.addEventListener('keyup', e => {
        caps.hidden = !(e.getModifierState && e.getModifierState('CapsLock'));
      });
      password.addEventListener('blur', () => caps.hidden = true);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.hidden = true;

        const validEmail = checkInput(email);
        const validPass = checkInput(password);

        if (!validEmail || !validPass) {
          const firstInvalid = !validEmail ? email : password;
          firstInvalid.focus();
          return;
        }

        btn.disabled = true;
        btn.classList.add('load');
        lbl.textContent = 'Connexion…';

        try {
          await new Promise(resolve => setTimeout(resolve, 900));

          if (email.value.trim().toLowerCase() !== 'admin@nahjo-group.com') {
            throw new Error('bad credential');
          }

          alertBox.textContent = 'Connexion réussie. Redirection…';
          alertBox.className = 'alert alert--ok';
          alertBox.hidden = false;
        } catch {
          alertBox.textContent = 'Identifiants incorrects. Vérifiez votre e-mail et votre mot de passe.';
          alertBox.className = 'alert';
          alertBox.hidden = false;
          password.select();
        } finally {
          btn.classList.remove('load');
          lbl.textContent = 'Se connecter';
          refreshButtonState();
        }
      });

      refreshButtonState();
    })();
  </script>
</body>
</html>
